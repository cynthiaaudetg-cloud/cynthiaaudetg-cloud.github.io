<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Perdu dans l'encre | Sokal Tattoo</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:#0a0a0c;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem;overflow:hidden;position:relative;
  }
  /* Halos rouge et bleu */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(ellipse at 20% 20%,rgba(255,10,22,.15),transparent 50%),
      radial-gradient(ellipse at 80% 80%,rgba(0,180,255,.15),transparent 50%);
    background-size:150% 150%;
    animation:fond-bouge 10s ease-in-out infinite;
  }
  @keyframes fond-bouge{
    0%,100%{background-position:0% 0%,100% 100%;}
    50%{background-position:100% 100%,0% 0%;}
  }
  /* Particules flottantes */
  body::after{
    content:"✦ · ✧ · ✦ · ✧ · ✦";position:fixed;top:0;left:0;right:0;z-index:1;pointer-events:none;
    text-align:center;font-size:1rem;letter-spacing:3rem;color:rgba(0,180,255,.2);
    animation:particules 12s linear infinite;
  }
  @keyframes particules{
    0%{transform:translateY(-20px);opacity:0;}
    10%,90%{opacity:1;}
    100%{transform:translateY(100vh);opacity:0;}
  }
  .contenu{position:relative;z-index:2;max-width:600px;}
  .logo{
    width:120px;height:auto;margin-bottom:1.5rem;
    filter:drop-shadow(0 0 20px rgba(0,180,255,.6)) drop-shadow(0 0 40px rgba(255,10,22,.4));
    animation:logo-flotte 5s ease-in-out infinite;
  }
  @keyframes logo-flotte{
    0%,100%{transform:perspective(600px) rotateY(-8deg) translateY(0);}
    50%{transform:perspective(600px) rotateY(8deg) translateY(-10px);}
  }
  .code{
    font-size:8rem;font-weight:900;line-height:1;
    background:linear-gradient(180deg,#fff 0%,#ff0a16 50%,#00b4ff 100%);
    background-size:100% 200%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 30px rgba(255,10,22,.4));
    animation:degrade-bouge 4s ease-in-out infinite;
  }
  @keyframes degrade-bouge{
    0%,100%{background-position:50% 0%;}
    50%{background-position:50% 100%;}
  }
  h1{
    font-size:1.8rem;margin:1rem 0;
    text-shadow:0 0 20px rgba(0,180,255,.5);
  }
  p{
    color:#ccc;font-size:1.1rem;margin-bottom:2rem;line-height:1.6;
  }
  .btn{
    display:inline-block;padding:1rem 2.5rem;font-size:1.1rem;font-weight:700;
    color:#fff;text-decoration:none;border-radius:50px;
    background:linear-gradient(135deg,#8f060d 0%,#ff0a16 40%,#0066cc 100%);
    border:1px solid rgba(0,180,255,.4);
    box-shadow:0 0 24px rgba(0,180,255,.3),0 4px 16px rgba(0,0,0,.4);
    transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{
    transform:translateY(-3px) scale(1.05);
    box-shadow:0 0 40px rgba(0,180,255,.5),0 0 60px rgba(255,10,22,.3);
  }
  .diamant{
    font-size:3rem;display:inline-block;margin-bottom:1rem;
    animation:diamant-tourne 4s ease-in-out infinite;
  }
  @keyframes diamant-tourne{
    0%,100%{transform:rotateY(0deg);}
    50%{transform:rotateY(180deg);}
  }
  @media (prefers-reduced-motion:reduce){
    body::before,body::after,.logo,.code,.diamant{animation:none;}
  }
</style>
</head>
<body>
  <div class="contenu">
    <img src="https://cynthiaaudetg-cloud.github.io/logo-tattoo-sokalite-blanc.png" alt="Sokal Tattoo" class="logo">
    <div class="diamant">💎</div>
    <div class="code">404</div>
    <h1>Oups! Perdu dans l'encre...</h1>
    <p>Cette page s'est fait tatouer par erreur! 😅<br>Mais pas de panique, on va te ramener à la maison.</p>
    <a href="https://cynthiaaudetg-cloud.github.io/" class="btn">🏠 Retour à l'accueil</a>
  </div>
</body>
</html>
